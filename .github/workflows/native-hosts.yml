name: Native host plugins

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/runtime/**'
      - 'tests/runtime/native-host-plugins.test.ts'
      - 'scripts/*native-host*'
      - 'scripts/*host-plugins*'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - 'package-lock.json'
      - '.github/workflows/native-hosts.yml'

permissions:
  contents: read

concurrency:
  group: native-hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/test-native-hosts.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-host-plugin-results
          path: .native-host-test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  host-plugins:
    name: Claude Code and Codex plugins
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:build
      - run: npm run plugins:check
      - run: bash scripts/test-host-plugins.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: host-plugin-results
          path: .native-host-test-logs/host-plugins/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  host-plugins-macos:
    name: Claude Code and Codex plugins (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:build
      - run: npm run plugins:check
      - name: Install pinned host CLIs
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.319 @openai/codex@0.167.0
      - name: Exercise installed plugins
        env:
          CROSSHEAD_SMOKE_ROOT: ${{ runner.temp }}/crosshead-plugin-smoke
        run: node scripts/smoke-host-plugins.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: host-plugin-macos-results
          path: ${{ runner.temp }}/crosshead-plugin-smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
