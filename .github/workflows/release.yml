name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-release:
    name: Build and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundary
      - run: npm run build
      - run: npm test
      - run: npm run release:build
      - run: node scripts/verify-release.mjs release --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crosshead-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and publish GitHub release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: crosshead-release-${{ github.sha }}
          path: release/
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Attest build provenance
        # GitHub supports attestations on public repositories (or Enterprise Cloud).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(node -p 'require("./release/crosshead-release.json").releaseId')"
          gh release create "$GITHUB_REF_NAME" release/*.tgz release/crosshead-release.json release/SHA256SUMS \
            --verify-tag \
            --title "Crosshead $GITHUB_REF_NAME" \
            --notes "Release ID \`$release_id\`. Verify downloads against \`SHA256SUMS\` and \`crosshead-release.json\`."

  publish-npm:
    name: Publish npm packages
    needs: release
    # Off until the repository is public and NPM_PUBLISH=true (see PUBLISHING.md).
    if: ${{ !github.event.repository.private && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm publish "release/crosshead-protocol-$version.tgz" --access public --provenance
          npm publish "release/crosshead-runtime-$version.tgz" --access public --provenance
