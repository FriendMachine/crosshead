name: Coding host customer journey

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/runtime/**'
      - 'scripts/smoke-coding-hosts.mjs'
      - '.github/workflows/coding-hosts.yml'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: coding-hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-journey:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:build
      - name: Install pinned real coding hosts with required native installers
        run: npm install --prefix "$RUNNER_TEMP/coding-hosts" --no-audit --no-fund @openai/codex@0.164.0 @anthropic-ai/claude-code@2.1.319
      - name: Exercise clean candidate install and real host hooks
        env:
          CROSSHEAD_TEST_CLAUDE_BIN: ${{ runner.temp }}/coding-hosts/node_modules/.bin/claude
          CROSSHEAD_TEST_CODEX_BIN: ${{ runner.temp }}/coding-hosts/node_modules/.bin/codex
        run: node scripts/smoke-coding-hosts.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coding-host-journey-${{ matrix.os }}
          path: .coding-host-test-logs/
          include-hidden-files: true
          retention-days: 14
